<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <title>Launching your SKYmora trip...</title>
  <style>
    body { background: #000; color: #fff; font-family: 'Playfair Display', serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; flex-direction: column; gap: 16px; }
    .logo .sky { color: #0099cc; font-size: 2rem; font-weight: 800; }
    .logo .mora { color: #fff; font-size: 2rem; }
    p { color: rgba(255,255,255,0.6); font-family: sans-serif; font-size: 0.95rem; }
  </style>
</head>
<body>
  <div class="logo"><span class="sky">SKY</span><span class="mora">mora</span></div>
  <p>Launching your New Delhi → Dubai journey...</p>
  <script>
    // Set the trip data into localStorage exactly as the form would
    const tripData = {
      name: "Aashi",
      nickname: "Explorer",
      departure: "New Delhi",
      destination: "Dubai",
      tripType: "return",
      adults: 1,
      children: 0,
      infants: 0,
      tripDays: 3,
      duration: 3,
      departureDate: "2026-06-10",
      returnDate: "2026-06-13",
      budget: 200000,
      currency: "INR",
      travelStyle: "Luxury",
      depTime: "Morning",
      retTime: "Evening",
      specialRequest: ""
    };

    localStorage.setItem("skymoraTrip", JSON.stringify(tripData));
    localStorage.removeItem("currentTripId");

    // Redirect to the real Skymora results page
    window.location.href = "/results.html";
  </script>
</body>
</html>
